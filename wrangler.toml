name = "kotoba-dojo"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Static client. The Worker only runs for /api/*; everything else is served
# straight from ./public by Cloudflare's asset layer.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# One Durable Object instance per dojo (lobby). Holds the answer key,
# the round timer, and every player's socket.
[[durable_objects.bindings]]
name = "DOJO"
class_name = "DojoLobby"

# One directory instance for the whole app, so players can see open dojos.
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DojoDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DojoLobby"]

[[durable_objects.bindings]]
name = "BATTLE"
class_name = "BattleRoyale"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DojoDirectory"]

[[durable_objects.bindings]]
name = "MINES"
class_name = "MineField"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["BattleRoyale"]

[[durable_objects.bindings]]
name = "BOUNTY"
class_name = "BountyOffice"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["MineField"]

[[durable_objects.bindings]]
name = "FLOOR"
class_name = "CasinoFloor"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["BountyOffice"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["CasinoFloor"]

# One instance per Lexicon Links round. Holds the eighteen words, every
# player's card, and the sockets — the answers never leave it.
[[durable_objects.bindings]]
name = "LINKS"
class_name = "LinksCourse"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["LinksCourse"]

# One reading room for the whole arena. Holds a copy of what every home
# screen polls — chat, feed, rankings, the wallet board — so the polls read
# memory here rather than querying Firestore once per browser.
[[durable_objects.bindings]]
name = "COMMONS"
class_name = "Commons"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["Commons"]

# Curated puzzle bank. Game content, not user data — the DO reads answers
# from here at round start.
[[kv_namespaces]]
binding = "PUZZLES"
id = "88025dc2b3074f3e97d615a6451107b1"

# The chat's moderation model runs here — a few dozen tokens a line.
[ai]
binding = "AI"

[vars]
# Must match the Firebase project whose ID tokens you accept.
FIREBASE_PROJECT_ID = "kotoba-dojo-1ad5f"
# Who sees the Reports panel and rules on appeals. Comma-separated uids.
ADMIN_UIDS = "tUcsYGm2n8ZWrHtIpLuUcLcVliE3"
# Accounts made before this moment are grandfathered; after it, registering
# needs an Etsy order number. Set once, when the keys went in.
KEY_EPOCH = "2026-09-20T16:00:00Z"
# The listing the invite and the gate point at. Empty until it exists.
ETSY_URL = ""

# Optional secret, set with:
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
# Paste the whole service-account JSON. Without it the Worker still runs;
# match history and the leaderboard just stop being written server-side.
